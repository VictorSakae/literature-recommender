[project]
name = "literature-recommender"
version = "0.1.0"
description = "Reprodução parcial de uma pipeline de recomendação de literatura científica."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "networkx",
    "matplotlib",
    "ipykernel",
    "openpyxl>=3.1.5",
    "openai>=3.19.2",
    "gensim==4.4.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"
